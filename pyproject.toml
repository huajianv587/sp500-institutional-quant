[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-institutional-quant"
version = "0.4.0"
description = "Point-in-time S&P 500 multi-agent institutional research and paper portfolio platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    "python-dotenv>=1.0.0",
    "typer>=0.21.0",
    "apscheduler>=3.10.4",
    "duckdb>=1.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "plotly>=6.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]
tradingagents-upstream = [
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "parsel>=1.10.0",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "rich>=14.0.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "yfinance>=1.4.1",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]

[project.scripts]
tradingagents = "cli.main:app"
sp500iq = "institutional_quant.cli:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "institutional_quant*"]

[tool.setuptools.package-data]
cli = ["static/*"]
institutional_quant = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "worklog"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
